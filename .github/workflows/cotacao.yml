name: Cotação CEASA

on:
  schedule:
    # Horário do GitHub é UTC (Brasília + 3h). 11:36 UTC = 08:36 em Brasília.
    # De 20 em 20 minutos até 15:36 UTC (12:36 em Brasília): 08:36 + 12 tentativas = 13 execuções,
    # de segunda a sexta. Evita o começo de cada hora, quando o GitHub mais atrasa agendamentos.
    - cron: "36,56 11 * * 1-5"
    - cron: "16,36,56 12-14 * * 1-5"
    - cron: "16,36 15 * * 1-5"
  workflow_dispatch:
    inputs:
      data:
        description: "Opcional, para teste: data no formato AAAA-MM-DD"
        required: false

permissions:
  contents: write

concurrency:
  group: cotacao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_TESTE: ${{ github.event.inputs.data }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Verificação leve: se já publicou hoje ou for fim de semana, para aqui (poucos segundos)
      - name: Precisa rodar?
        id: verifica
        run: python cotacao_ceasa_publicar.py --precisa-rodar

      - name: Instalar componentes
        if: steps.verifica.outputs.rodar == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Consultar o CEASA e publicar
        if: steps.verifica.outputs.rodar == 'true'
        shell: bash
        run: python cotacao_ceasa_publicar.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Salvar no repositório
        if: steps.verifica.outputs.rodar == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for pasta in dados docs; do
            if [ -e "$pasta" ]; then git add "$pasta"; fi
          done
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "Cotação CEASA $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
          fi
